[package]
name = "madsquash"
version = "0.1.1"
edition = "2024"
description = "AppImage manager and runner by Madko"
repository = "https://github.com/AchmadEko003/madsquash"
license = "MIT"

[dependencies]
backhand = "0.25.5"
gpui-kit = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"         # Mengoptimalkan ukuran binary (size optimization)
lto = true              # Link-Time Optimization (memangkas kode yang tidak terpakai antar-crate)
codegen-units = 1       # Maksimalkan optimasi ukuran lintas modul
panic = "abort"         # Hapus tabel stack unwinding untuk memangkas ukuran
strip = true            # Hapus semua simbol debug dan info yang tidak diperlukan secara otomatis
