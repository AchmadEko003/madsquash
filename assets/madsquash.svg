      <stop offset="0%" stop-color="#1c2533"/>
      <stop offset="100%" stop-color="#11161e"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bc7e8"/>
